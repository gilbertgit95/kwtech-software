packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  typescript: 7.0.2
  '@types/node': 24.10.1

  # Reading and writing .xlsx in the BROWSER (issue #35): web-ui's workbook
  # helpers and import wizard, loaded only when a screen opens one. One version
  # for web-ui (dev, and its optional peer) and web-app (which installs it).
  exceljs: 4.4.0

  # Nest is catalogued, not merely pinned per package, because a SECOND copy is
  # not a duplicate — it is a bug. Nest's exception filter decides an HTTP
  # status with `instanceof HttpException`, and a module that threw an
  # UnauthorizedException built from a different copy of @nestjs/common failed
  # that check: every 401 and 400 raised inside module-auth and
  # module-permissions reached the client as a 500. Found by running it.
  #
  # The modules keep a permissive `^11.0.0` PEER range — a consumer may use any
  # Nest 11 — while every devDependency and app dependency here resolves through
  # this one entry, so the workspace links a single instance.
  '@nestjs/common': 11.1.29
  '@nestjs/core': 11.1.29
  '@nestjs/platform-express': 11.1.29
  reflect-metadata: 0.2.2

  # Catalogued for the SAME reason as Nest itself, after the same bug bit twice.
  #
  # module-permissions declared '@nestjs/graphql' but not 'graphql', so pnpm
  # resolved it against a different peer (graphql 16) from the app's (17) — and
  # a differing peer set means a SEPARATE INSTANCE. Two instances of
  # @nestjs/graphql means two `TypeMetadataStorage` registries: `@ArgsType()` in
  # the module registered the class in one, the schema builder in the app read
  # the other, and the server died at BOOT with
  #
  #   CannotDetermineInputTypeError: Cannot determine a GraphQL input type for "limit"
  #
  # Object types had survived it by accident — `@Query(() => Type)` hands the
  # class over directly, so the builder never consults the registry. Args types
  # cannot: they are looked up by class, in whichever registry the reader owns.
  #
  # Found by running it. `tsc` cannot see this; the schema is built at runtime
  # from decorator metadata, so the build was green and the app would not start.
  '@nestjs/graphql': 13.4.5
  '@nestjs/apollo': 13.4.5
  graphql: 17.0.2

  # Drag and drop, in the catalog since its SECOND consumer: module-app-hub
  # reorders tabs with it, and module-note reorders the notes list. One version
  # for both, so a drag behaves the same on the Apps page and inside an app.
  '@dnd-kit/core': ^6.3.1
  '@dnd-kit/sortable': ^10.0.0
  '@dnd-kit/utilities': ^3.2.2

# pnpm 11 does not run dependency install scripts unless they are allowlisted
# here. Keep it to packages that genuinely need a build step and no more.
#
#   @prisma/engines  the schema engine binary that backs migrate/introspect
#   prisma           CLI postinstall
#   lefthook         installs the hook binary and syncs .git/hooks
#
# Under Prisma 7 the client itself needs no build step: it is generated as
# TypeScript source, with no Rust engine to download.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  lefthook: true
  # Both ship a Rust native binding and use their install script to select the
  # right prebuilt binary for the platform. @swc/core is the Jest transform
  # (PLAN §3: swc, not ts-jest); unrs-resolver arrives under it.
  '@swc/core': true
  unrs-resolver: true
  # Denied, and it loses nothing: esbuild's install script only checks that the
  # platform binary runs, and that binary arrives by itself as an optional
  # dependency (@esbuild/linux-x64, ...). It bundles the print agent into one
  # file (apps/print-agent, `pnpm bundle`).
  esbuild: false
  # Denied, not merely unlisted, so the prompt does not come back every install
  # and the decision is on the record: @scarf/scarf's install script exists to
  # phone home with analytics about who is installing what. It arrives under
  # Prisma and nothing needs it to run.
  '@scarf/scarf': false
  # Denied, and on the record for the same reason @scarf/scarf is. It arrives
  # under @apollo/server purely for USAGE REPORTING to Apollo Studio, which this
  # deployment does not use and cannot use without an APOLLO_KEY. Its install
  # script is a vendored protobuf build; nothing on the query path calls it, and
  # the pure-JS path is what runs either way.
  '@apollo/protobufjs': false

# Security fixes for INDIRECT dependencies (#169). Dependabot opens alerts for
# these but cannot fix them: the packages that pull them in (Nest 11, Apollo,
# Prisma's CLI, jest, @nestjs/cli, pm2, exceljs) still pin a vulnerable range.
# Each entry lifts ONE major line to its first patched release, the selector
# (`name@range`) keeping it to that line, so nothing jumps further than the
# advisory needs.
#
# The entries that cross a major (uuid, deepmerge-ts, basic-ftp, glob,
# minimatch) have no patched release on the old line. Every target
# still ships a CommonJS build and runs on Node 22; the test suite, the builds
# and a boot of both apps are what showed the parents still work.
#
# NOT here: picomatch (ReDoS in extglobs, under jest, chokidar and the Nest
# CLI). Its advisory names 4.0.8 as the fix, and on 2026-11-18 the newest
# release is 4.0.7, so there is nothing to lift it to; the alert stays open
# until 4.0.8 is published (PLAN §12).
#
# Remove an entry once its parent's own range reaches the patched version
# (`pnpm why <name>`): an override left behind pins a version forever, and the
# next fix after it never arrives.
overrides:
  # Express 5 / Nest 11 / Apollo request handling: the API's HTTP surface.
  proxy-addr@2: ^2.0.8
  body-parser@2: ^2.4.0
  qs@6: ^6.16.1
  multer@2: ^2.5.0
  '@graphql-tools/utils@12': ^12.0.2
  # Prisma's CLI (migrate, generate); not on the request path.
  mysql2@3: ^3.23.1
  deepmerge-ts@7: ^8.0.0
  fast-uri@3: ^3.1.9
  # Build and test tooling: jest, @nestjs/cli, commitlint, postcss.
  brace-expansion@1: ^1.1.21
  brace-expansion@2: ^2.1.7
  brace-expansion@5: ^5.0.12
  js-yaml@3: ^3.15.2
  js-yaml@4: ^4.3.2
  js-yaml@5: ^5.4.1
  glob@10: ^14.0.2
  glob@13: ^14.0.2
  minimatch@9: ^11.0.1
  minimatch@10: ^11.0.1
  source-map-js@1: ^1.2.2
  # pm2 (running the built apps): its proxy agent's FTP client and its API
  # client's redirects.
  basic-ftp@5: ^6.2.4
  follow-redirects@1: ^1.16.2
  # exceljs (spreadsheets in the browser) only calls uuid v4, which the
  # advisory (v3/v5/v6 with a buffer) does not touch; lifted so the alert
  # closes rather than staying open as "not affected".
  uuid@8: ^11.1.1
