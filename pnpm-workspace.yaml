packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  typescript: 7.0.2
  '@types/node': 24.10.1

  # Nest is catalogued, not merely pinned per package, because a SECOND copy is
  # not a duplicate — it is a bug. Nest's exception filter decides an HTTP
  # status with `instanceof HttpException`, and a module that threw an
  # UnauthorizedException built from a different copy of @nestjs/common failed
  # that check: every 401 and 400 raised inside module-auth and
  # module-permissions reached the client as a 500. Found by running it.
  #
  # The modules keep a permissive `^11.0.0` PEER range — a consumer may use any
  # Nest 11 — while every devDependency and app dependency here resolves through
  # this one entry, so the workspace links a single instance.
  '@nestjs/common': 11.1.29
  '@nestjs/core': 11.1.29
  '@nestjs/platform-express': 11.1.29
  reflect-metadata: 0.2.2

  # Catalogued for the SAME reason as Nest itself, after the same bug bit twice.
  #
  # module-permissions declared '@nestjs/graphql' but not 'graphql', so pnpm
  # resolved it against a different peer (graphql 16) from the app's (17) — and
  # a differing peer set means a SEPARATE INSTANCE. Two instances of
  # @nestjs/graphql means two `TypeMetadataStorage` registries: `@ArgsType()` in
  # the module registered the class in one, the schema builder in the app read
  # the other, and the server died at BOOT with
  #
  #   CannotDetermineInputTypeError: Cannot determine a GraphQL input type for "limit"
  #
  # Object types had survived it by accident — `@Query(() => Type)` hands the
  # class over directly, so the builder never consults the registry. Args types
  # cannot: they are looked up by class, in whichever registry the reader owns.
  #
  # Found by running it. `tsc` cannot see this; the schema is built at runtime
  # from decorator metadata, so the build was green and the app would not start.
  '@nestjs/graphql': 13.4.5
  '@nestjs/apollo': 13.4.5
  graphql: 17.0.2

# pnpm 11 does not run dependency install scripts unless they are allowlisted
# here. Keep it to packages that genuinely need a build step and no more.
#
#   @prisma/engines  the schema engine binary that backs migrate/introspect
#   prisma           CLI postinstall
#   lefthook         installs the hook binary and syncs .git/hooks
#
# Under Prisma 7 the client itself needs no build step: it is generated as
# TypeScript source, with no Rust engine to download.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  lefthook: true
  # Both ship a Rust native binding and use their install script to select the
  # right prebuilt binary for the platform. @swc/core is the Jest transform
  # (PLAN §3: swc, not ts-jest); unrs-resolver arrives under it.
  '@swc/core': true
  unrs-resolver: true
  # Denied, not merely unlisted, so the prompt does not come back every install
  # and the decision is on the record: @scarf/scarf's install script exists to
  # phone home with analytics about who is installing what. It arrives under
  # Prisma and nothing needs it to run.
  '@scarf/scarf': false
  # Denied, and on the record for the same reason @scarf/scarf is. It arrives
  # under @apollo/server purely for USAGE REPORTING to Apollo Studio, which this
  # deployment does not use and cannot use without an APOLLO_KEY. Its install
  # script is a vendored protobuf build; nothing on the query path calls it, and
  # the pure-JS path is what runs either way.
  '@apollo/protobufjs': false
