# Client operations owned by the module.
#
# Consuming apps add this path to their graphql-codegen `documents` glob:
#   documents: ['src/**/*.{tsx,graphql}', '../../packages/module-*/src/graphql/*.graphql']
# so the generated hooks land in the app, typed against the composed schema.
# See docs/PLAN.md §9 for why the hooks are generated app-side rather than here.

query MyPermissions {
  myPermissions {
    subjectId
    organizationId
    workspaceId
    effective
    granted
    entitled
    grantedAtAppLevel
    accessibleWorkspaceIds
    appRoles {
      key
      label
      icon
    }
  }
}

# Paged, and the variables are OPTIONAL because the server has its own default
# and its own cap — a client that omits them gets a bounded page rather than
# everything, and one that asks for more than the cap gets the cap.
query PermissionFeatures($limit: Int, $offset: Int) {
  permissionFeatures(limit: $limit, offset: $offset) {
    total
    limit
    offset
    hasMore
    items {
      key
      module
      label
      description
      isPrivileged
    }
  }
}

# ── plans and subscriptions ───────────────────────────────────────────────────
#
# A plan is a named collection of features an organization can BUY, as a role is
# one a person can be GIVEN. The two are never merged: a role says the PERSON
# may, a plan says the ORGANIZATION bought it, and a feature needs both — which
# is what lets a denial say "ask an administrator" or "upgrade your plan".

# Includes ARCHIVED plans. An administrator has to see one in order to restore
# it, and a list that hid them would make the switch look like a delete.
query PermissionPlans {
  permissionPlans {
    key
    label
    isPublic
    icon
    archived
    features
    limits {
      limitKey
      value
    }
  }
}

# Includes ENDED subscriptions, for a different reason: an ended row has no
# switch to flip, it IS the history. "What was this organization entitled to in
# March" is answered by reading these.
query PermissionSubscriptions($organizationId: String) {
  permissionSubscriptions(organizationId: $organizationId) {
    id
    organizationId
    organizationName
    workspaceId
    workspaceName
    planKey
    planLabel
    # An archived plan entitles nothing, however live the row looks. Without
    # this field a screen cannot explain a subscription that reads `active` and
    # is giving nobody anything.
    planArchived
    status
    currentPeriodEnd
    endedAt
  }
}
