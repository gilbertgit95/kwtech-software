# Client operations owned by the module.
#
# Consuming apps add this path to their graphql-codegen `documents` glob:
#   documents: ['src/**/*.{tsx,graphql}', '../../packages/module-*/src/graphql/*.graphql']
# so the generated hooks land in the app, typed against the composed schema.
# See docs/PLAN.md §9 for why the hooks are generated app-side rather than here.

query MyPermissions {
  myPermissions {
    subjectId
    organizationId
    workspaceId
    effective
    granted
    entitled
    grantedAtAppLevel
    accessibleWorkspaceIds
  }
}

# Paged, and the variables are OPTIONAL because the server has its own default
# and its own cap — a client that omits them gets a bounded page rather than
# everything, and one that asks for more than the cap gets the cap.
query PermissionFeatures($limit: Int, $offset: Int) {
  permissionFeatures(limit: $limit, offset: $offset) {
    total
    limit
    offset
    hasMore
    items {
      key
      module
      label
      description
      isPrivileged
    }
  }
}
