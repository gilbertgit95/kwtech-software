# Releases (#204): one product version, raised by changesets.
#
# Every push to main runs it. Two states, decided by whether changesets are
# pending in `.changeset/`:
#
# - **Pending:** keeps ONE pull request open, "chore(release): kwtech
#   <version>" on the branch `changeset-release/main`, that runs `pnpm
#   changeset:version`: the next version on every package, ONE section of
#   release notes in CHANGELOG.md, the changesets removed. Each new merge
#   updates the same PR.
# - **None pending** (the version PR was just merged, or nothing was ever
#   added): tags `v<version>` and creates the GitHub release with that
#   version's notes, once. A version that is already tagged, or 0.0.0, does
#   nothing. #133's P2 adds the image and print agent builds to this.
#
# ⚠ Needs "Allow GitHub Actions to create and approve pull requests"
# (Settings → Actions → General → Workflow permissions), or `gh pr create`
# fails with "GitHub Actions is not permitted to create or approve pull
# requests". And a PR opened with the workflow's own token starts no
# workflows (GitHub's rule against loops), so the version PR shows no CI
# checks: it changes only versions and CHANGELOG.md, which every later PR's
# CI covers again.
name: Release

on:
  push:
    branches: [main]
  # Publish an existing release again (its images, bundle and print agent),
  # e.g. after a failed publish. Never makes a version or a tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'The released version to publish again, e.g. 0.1.0 (tag v0.1.0 must exist)'
        required: true

# One at a time and never cancelled: two runs at once could both see "not
# tagged yet" and tag the same version, and a cancelled run can stop between
# the tag and the release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Version PR or release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      # The version tagged by THIS run, or empty: what the publish job builds.
      released: ${{ steps.tag.outputs.released }}
    steps:
      - uses: actions/checkout@v5
        with:
          # changesets compares against main's history, and the tag check reads tags.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Pending = any file in .changeset/ but its README and config. Read
      # here, not from changesets/action, which crashed building the PR body
      # from per-package CHANGELOG.md files we do not write (#208).
      - name: Changesets pending?
        id: pending
        run: |
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "$count changeset(s) pending."

      - name: Keep the version PR up to date
        if: steps.pending.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Rebuilt from this main every time, so the PR always holds exactly
          # the changesets pending now, never a stale version.
          git switch -C changeset-release/main
          pnpm changeset:version
          version=$(node scripts/release-version.mjs)
          node scripts/release-version.mjs notes --print "$version" > "$RUNNER_TEMP/notes.md"
          {
            echo "Merging this releases **kwtech $version**: every package moves to $version, the notes below go to CHANGELOG.md and the GitHub release, and the changesets are removed. Edit a sentence in CHANGELOG.md here before merging if it needs it (docs/RELEASING.md)."
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/body.md"
          git add -A
          # --no-verify: the hooks format and lint what a person wrote; this
          # commit is versions and generated notes only.
          git commit --no-verify -m "chore(release): kwtech $version"
          git push --force origin changeset-release/main
          # Conventional and short: the PR title check and the squash
          # merge's header (CLAUDE.md, Conventions).
          title="chore(release): kwtech $version"
          number=$(gh pr list --head changeset-release/main --base main --state open --json number -q '.[0].number')
          if [ -n "$number" ]; then
            # Not `gh pr edit`: it fails in this repository on a Projects
            # (classic) query. The REST endpoint does not.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$number" -f title="$title" -F body=@"$RUNNER_TEMP/body.md" >/dev/null
            echo "Updated the version PR #$number for $version."
          else
            gh pr create --base main --head changeset-release/main --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Tag and release the version
        id: tag
        if: steps.pending.outputs.count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Refuses, naming them, when the packages disagree: a tag for a
          # version half of them do not carry would be worse than none.
          node scripts/release-version.mjs check
          version=$(node scripts/release-version.mjs)
          if [ "$version" = "0.0.0" ]; then
            echo "Nothing released yet (0.0.0): no tag."
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged."
            exit 0
          fi
          node scripts/release-version.mjs notes --print "$version" > "$RUNNER_TEMP/notes.md"
          gh release create "v$version" --target "$GITHUB_SHA" --title "kwtech $version" --notes-file "$RUNNER_TEMP/notes.md"
          echo "released=$version" >> "$GITHUB_OUTPUT"

  # #215 (#133 P2): what a shop downloads, built from the tag and checked
  # before anything is published. Here, in the same workflow, because a tag
  # pushed with the workflow's own token starts no other workflow.
  publish:
    name: Images, install bundle, print agent
    needs: release
    if: always() && (needs.release.outputs.released != '' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.release.outputs.released || inputs.version }}
      # ghcr.io/<owner>/kwtech-api and -web: compose.yml's default KWTECH_IMAGES.
      IMAGES: ghcr.io/${{ github.repository_owner }}/kwtech
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ env.VERSION }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # amd64 only for now: shop PCs are x86, and arm64 under emulation builds
      # 5 to 10 times slower (PLAN §12).
      - name: Build the images
        run: |
          docker build -f deploy/docker/api.Dockerfile -t "kwtech-api:$VERSION" -t "$IMAGES-api:$VERSION" -t "$IMAGES-api:stable" .
          docker build -f deploy/docker/web.Dockerfile -t "kwtech-web:$VERSION" -t "$IMAGES-web:$VERSION" -t "$IMAGES-web:stable" .

      # Boots them on an empty database exactly as a shop runs them; nothing
      # is published unless it passes.
      - name: Release check
        env:
          KWTECH_CHECK_TAG: ${{ env.VERSION }}
        run: deploy/docker/check-release.sh --no-build

      - name: Push the images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # The version tag is never moved again; `stable` follows the newest release.
          for image in api web; do
            docker push "$IMAGES-$image:$VERSION"
            docker push "$IMAGES-$image:stable"
          done

      - run: pnpm install --frozen-lockfile

      - name: The print agent zip
        run: |
          # The release's version is stamped into the bundle (scripts/bundle.mjs).
          pnpm --filter @kwtech/print-agent bundle
          stage="$RUNNER_TEMP/print-agent"
          mkdir -p "$stage"
          cp apps/print-agent/dist/bundle/print-agent.mjs "$stage/"
          # The one library the bundle does not carry: it brings SumatraPDF, a
          # Windows program (apps/print-agent/README.md, step 2).
          (cd "$stage" && npm init -y >/dev/null && npm install --omit=dev --no-audit --no-fund pdf-to-printer@5.8.1 >/dev/null)
          mkdir -p "$RUNNER_TEMP/out"
          (cd "$stage" && zip -qr "$RUNNER_TEMP/out/kwtech-print-agent-$VERSION.zip" .)
          # A fixed name too, for releases/latest/download/kwtech-print-agent.zip.
          cp "$RUNNER_TEMP/out/kwtech-print-agent-$VERSION.zip" "$RUNNER_TEMP/out/kwtech-print-agent.zip"

      - name: The install bundle
        run: |
          bundle="$RUNNER_TEMP/kwtech-install-$VERSION"
          mkdir -p "$bundle/docker" "$bundle/windows"
          cp deploy/docker/compose.yml deploy/docker/Caddyfile.docker deploy/docker/README.md "$bundle/docker/"
          # The version filled in: the bundle runs exactly the images it shipped with.
          sed "s/^KWTECH_VERSION=\"\"$/KWTECH_VERSION=\"$VERSION\"/" deploy/docker/.env.example > "$bundle/docker/.env.example"
          cp -r deploy/windows/. "$bundle/windows/"
          (cd "$RUNNER_TEMP" && zip -qr "$RUNNER_TEMP/out/kwtech-install-$VERSION.zip" "kwtech-install-$VERSION")
          cp "$RUNNER_TEMP/out/kwtech-install-$VERSION.zip" "$RUNNER_TEMP/out/kwtech-install.zip"

      - name: No secret in the zips
        run: |
          for zip in "$RUNNER_TEMP"/out/*.zip; do
            if unzip -Z1 "$zip" | grep -Ei '(^|/)\.env$|(^|/)\.env\.local$|(^|/)envs/|(^|/)\.caddy/|\.key$|\.fixture\.json$'; then
              echo "::error::$(basename "$zip") holds a file that must never ship (listed above)."
              exit 1
            fi
          done

      - name: Checksums, and upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/out"
          sha256sum *.zip > SHA256SUMS.txt
          for image in api web; do
            echo "$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGES-$image:$VERSION")" >> SHA256SUMS.txt
          done
          gh release upload "v$VERSION" ./*.zip SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
